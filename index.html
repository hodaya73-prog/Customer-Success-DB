<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Network requests are limited to this site. The Airtable token is never in the browser: the server adds it. -->
<meta http-equiv="Content-Security-Policy" content="connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Customer Retention Dashboard</title>
</head>
<body>
<div class="page">
  <header class="header">
    <div class="title">
      <h1>Customer Retention Dashboard</h1>
      <p data-i18n="subtitle"></p>
    </div>
    <div class="header-actions">
      <span class="chip" id="modeChip"></span>
      <button type="button" class="btn ghost small" id="btnReset" data-i18n="reset"></button>
      <div class="lang" role="group" aria-label="Language / שפה">
        <button type="button" id="langHe" data-lang="he" lang="he">עברית</button>
        <button type="button" id="langEn" data-lang="en" lang="en">EN</button>
      </div>
    </div>
  </header>

  <section class="kpis" id="kpis" aria-label="KPI"></section>

  <section class="toolbar">
    <div class="toolbar-top">
      <div class="search field">
        <label for="q" class="lbl" data-i18n="searchLabel" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)"></label>
        <input type="search" id="q" data-i18n-placeholder="searchPh" autocomplete="off">
      </div>
      <div class="toolbar-buttons">
        <button type="button" class="btn" id="btnImport" data-i18n="import"></button>
        <button type="button" class="btn" id="btnExport" data-i18n="export"></button>
        <button type="button" class="btn mint" id="btnAdd" data-i18n="add"></button>
      </div>
    </div>
    <div class="filters">
      <div class="field"><label for="fRisk" data-i18n="fRisk"></label><select id="fRisk"></select></div>
      <div class="field"><label for="fActivity" data-i18n="fActivity"></label><select id="fActivity"></select></div>
      <div class="field"><label for="fTickets" data-i18n="fTickets"></label><select id="fTickets"></select></div>
      <div class="field"><label for="fProduct" data-i18n="fProduct"></label><select id="fProduct"></select></div>
      <button type="button" class="btn ghost" id="btnClear" data-i18n="clearFilters"></button>
    </div>
  </section>

  <section class="table-card">
    <div class="table-head">
      <div class="count" id="count" aria-live="polite"></div>
      <button type="button" class="btn small" id="btnRefresh" data-i18n="refresh" hidden></button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr id="thead"></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </section>

  <p class="footer" id="footer"></p>
</div>

<input type="file" id="fileInput" accept=".csv,text/csv" hidden>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<!-- Add / edit dialog -->
<dialog id="dlgCustomer" aria-labelledby="custTitle">
  <form id="custForm" novalidate>
    <div class="dlg-head"><h2 id="custTitle"></h2></div>
    <div class="dlg-body">
      <div class="form-grid">
        <div class="field full" id="idRow" hidden>
          <label for="f_id" data-i18n="col.id"></label>
          <input type="text" id="f_id" class="ltr" readonly>
        </div>
        <div class="field full">
          <label for="f_name" data-i18n="col.name"></label>
          <input type="text" id="f_name" autocomplete="off" aria-describedby="e_name">
          <div class="err" id="e_name"></div>
        </div>
        <div class="field">
          <label for="f_phone" data-i18n="col.phone"></label>
          <input type="text" id="f_phone" class="ltr" inputmode="tel" autocomplete="off" aria-describedby="e_phone">
          <div class="err" id="e_phone"></div>
        </div>
        <div class="field">
          <label for="f_email"><span data-i18n="col.email"></span> <span class="opt" data-i18n="optional"></span></label>
          <input type="email" id="f_email" class="ltr" autocomplete="off" aria-describedby="e_email">
          <div class="err" id="e_email"></div>
        </div>
        <div class="field">
          <label for="f_city"><span data-i18n="col.city"></span> <span class="opt" data-i18n="optional"></span></label>
          <input type="text" id="f_city" autocomplete="off">
        </div>
        <div class="field">
          <label for="f_lastPurchaseDate" data-i18n="col.lastPurchaseDate"></label>
          <input type="date" id="f_lastPurchaseDate" aria-describedby="e_lastPurchaseDate">
          <div class="err" id="e_lastPurchaseDate"></div>
        </div>
        <div class="field">
          <label for="f_totalPurchases"><span data-i18n="col.totalPurchases"></span> (₪)</label>
          <input type="number" id="f_totalPurchases" min="0" step="0.01" inputmode="decimal" aria-describedby="e_totalPurchases">
          <div class="err" id="e_totalPurchases"></div>
        </div>
        <div class="field">
          <label for="f_lastProduct" data-i18n="col.lastProduct"></label>
          <select id="f_lastProduct" aria-describedby="e_lastProduct"></select>
          <div class="err" id="e_lastProduct"></div>
        </div>
        <div class="field">
          <label for="f_satisfaction" data-i18n="col.satisfaction"></label>
          <select id="f_satisfaction" aria-describedby="e_satisfaction"></select>
          <div class="err" id="e_satisfaction"></div>
        </div>
        <div class="field">
          <label for="f_openTickets" data-i18n="col.openTickets"></label>
          <input type="number" id="f_openTickets" min="0" step="1" inputmode="numeric" aria-describedby="e_openTickets">
          <div class="err" id="e_openTickets"></div>
        </div>
      </div>
    </div>
    <div class="dlg-foot">
      <button type="button" class="btn" id="custCancel" data-i18n="cancel"></button>
      <button type="submit" class="btn primary" id="custSubmit" data-i18n="save"></button>
    </div>
  </form>
</dialog>

<!-- Confirm dialog (delete / reset) -->
<dialog id="dlgConfirm" aria-labelledby="confTitle">
  <div class="dlg-head"><h2 id="confTitle"></h2></div>
  <div class="dlg-body" id="confBody"></div>
  <div class="dlg-foot">
    <button type="button" class="btn" id="confCancel" data-i18n="cancel"></button>
    <button type="button" class="btn danger" id="confOk"></button>
  </div>
</dialog>

<!-- Import summary dialog -->
<dialog id="dlgImport" aria-labelledby="impTitle">
  <div class="dlg-head"><h2 id="impTitle"></h2></div>
  <div class="dlg-body" id="impBody"></div>
  <div class="dlg-foot">
    <button type="button" class="btn" id="impCancel"></button>
    <button type="button" class="btn primary" id="impOk" data-i18n="impConfirm"></button>
  </div>
</dialog>
<script type="module" src="/src/main.js"></script>
</body>
</html>
