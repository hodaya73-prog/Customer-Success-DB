<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The Airtable token never leaves this browser except to api.airtable.com: other network requests are blocked. -->
<meta http-equiv="Content-Security-Policy" content="connect-src https://api.airtable.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Customer Retention Dashboard</title>
<style>
  :root {
    --bg: #f4f6f9;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #596273;
    --line: #e3e7ee;
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --primary-soft: #eaf1ff;
    --red: #dc2626;
    --red-text: #b91c1c;
    --red-bg: #fef2f2;
    --red-line: #fecaca;
    --amber: #b45309;
    --amber-bg: #fff7ed;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, "Segoe UI", Arial, sans-serif;
    font-size: 15px;
    line-height: 1.45;
  }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

  .page { max-width: 1280px; margin: 0 auto; padding: 24px 20px 40px; }

  /* Header */
  .header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  .title h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -.01em; }
  .title p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
  .header-actions { display: flex; align-items: center; gap: 12px; }
  .lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; background: var(--card); padding: 3px; }
  .lang button { border: 0; background: transparent; padding: 5px 14px; border-radius: 999px; cursor: pointer; color: var(--muted); font-weight: 600; }
  .lang button[aria-pressed="true"] { background: var(--primary); color: #fff; }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 600; white-space: nowrap;
  }
  .btn:hover { background: #f8fafc; border-color: #cfd6e2; }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.primary:hover { background: var(--primary-dark); border-color: var(--primary-dark); }
  .btn.mint { background: #6ee7b7; border-color: #6ee7b7; color: #064e3b; }
  .btn.mint:hover { background: #4fd8a5; border-color: #4fd8a5; }
  .btn.danger { background: var(--red); border-color: var(--red); color: #fff; }
  .btn.danger:hover { background: #b91c1c; border-color: #b91c1c; }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--muted); font-weight: 500; }
  .btn.ghost:hover { background: #e9edf3; }
  .btn.small { padding: 4px 10px; font-size: 13px; }

  /* KPI */
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
  .kpi { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 20px; border-top: 4px solid var(--primary); }
  .kpi.warn { border-top-color: #f87171; background: var(--red-bg); }
  .kpi-label { font-size: 14px; color: var(--muted); font-weight: 600; }
  .kpi-value { font-size: 34px; font-weight: 700; line-height: 1.15; margin: 4px 0 2px; font-variant-numeric: tabular-nums; }
  .kpi.warn .kpi-value { color: var(--red-text); }
  .kpi-sub { font-size: 13px; color: var(--muted); }
  .kpi-sub.risk { color: var(--red-text); font-weight: 600; }

  /* Toolbar */
  .toolbar { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 16px; display: grid; gap: 14px; }
  .toolbar-top { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .search { flex: 1 1 280px; position: relative; }
  .search input { width: 100%; padding: 9px 12px; border: 1px solid #cfd6e2; border-radius: 8px; background: #fff; }
  .toolbar-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
  .filters { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
  .field { display: grid; gap: 4px; }
  .field label, .field .lbl { font-size: 13px; font-weight: 600; color: var(--muted); }
  select, .field input[type="text"], .field input[type="email"], .field input[type="number"], .field input[type="date"], .field input[type="search"] {
    padding: 8px 10px; border: 1px solid #cfd6e2; border-radius: 8px; background: #fff; min-width: 0;
  }
  .filters select { min-width: 150px; }

  /* Table */
  .table-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .table-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); gap: 12px; flex-wrap: wrap; }
  .count { font-weight: 600; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; min-width: 1150px; border-collapse: separate; border-spacing: 0; }
  th, td { padding: 10px 12px; text-align: start; border-bottom: 1px solid var(--line); vertical-align: middle; }
  thead th { background: #f8fafc; font-size: 13px; color: var(--muted); white-space: nowrap; padding: 0; }
  thead th .sort { width: 100%; border: 0; background: transparent; cursor: pointer; padding: 11px 12px; text-align: start; font-weight: 700; color: inherit; display: inline-flex; gap: 6px; align-items: center; }
  thead th .sort:hover { color: var(--text); background: #eef2f7; }
  thead th.plain { padding: 11px 12px; font-weight: 700; }
  .arrow { font-size: 10px; color: var(--primary); min-width: 10px; }
  tbody tr:hover td { background: #f8fafc; }
  tbody tr td:first-child { border-inline-start: 4px solid transparent; }
  tbody tr.risk td { background: var(--red-bg); border-bottom-color: var(--red-line); }
  tbody tr.risk:hover td { background: #fee2e2; }
  tbody tr.risk td:first-child { border-inline-start-color: var(--red); }
  td.num, th.num { text-align: end; font-variant-numeric: tabular-nums; }
  th.num .sort { justify-content: flex-end; text-align: end; }
  .mono { font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
  .name { font-weight: 600; white-space: nowrap; }
  .nowrap { white-space: nowrap; }
  .tag { display: inline-block; margin-inline-start: 6px; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; background: #eef0f4; color: var(--muted); }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--red); color: #fff; margin-inline-start: 8px; }
  .sat { display: inline-flex; align-items: center; gap: 8px; }
  .sat b { min-width: 1ch; font-variant-numeric: tabular-nums; }
  .dots { display: inline-flex; gap: 3px; }
  .dots i { width: 8px; height: 8px; border-radius: 50%; background: #d5dbe5; display: block; }
  .dots i.on { background: var(--primary); }
  tr.risk .dots i.on { background: var(--red); }
  tr.risk .sat b { color: var(--red-text); }
  .tix-pos { font-weight: 700; color: var(--amber); }
  .actions { white-space: nowrap; display: flex; gap: 6px; }
  .empty { text-align: center; padding: 40px 16px; color: var(--muted); }
  .empty strong { display: block; color: var(--text); font-size: 16px; margin-bottom: 4px; }
  .empty .btn { margin-top: 12px; }

  .footer { margin-top: 16px; color: var(--muted); font-size: 13px; }
  .footer .warn-text { color: var(--red-text); font-weight: 600; display: block; margin-top: 4px; }

  /* Dialogs */
  dialog { border: 0; border-radius: 14px; padding: 0; width: min(560px, calc(100vw - 32px)); box-shadow: 0 20px 50px rgba(15, 23, 42, .3); color: var(--text); background: var(--card); }
  dialog::backdrop { background: rgba(15, 23, 42, .45); }
  .dlg-head { padding: 18px 22px 0; }
  .dlg-head h2 { margin: 0; font-size: 19px; }
  .dlg-body { padding: 14px 22px; max-height: min(70vh, 640px); overflow-y: auto; }
  .dlg-foot { padding: 12px 22px 18px; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
  .form-grid .full { grid-column: 1 / -1; }
  .form-grid input, .form-grid select { width: 100%; }
  .opt { font-weight: 400; color: var(--muted); }
  .hint { font-size: 12px; color: var(--muted); }
  .err { color: var(--red-text); font-size: 13px; font-weight: 600; min-height: 0; }
  .field input[aria-invalid="true"], .field select[aria-invalid="true"] { border-color: var(--red); background: var(--red-bg); }
  .ltr { direction: ltr; text-align: start; }
  .summary-list { margin: 8px 0 0; padding-inline-start: 20px; max-height: 190px; overflow-y: auto; font-size: 14px; }
  .summary-block { margin-bottom: 14px; }
  .summary-block h3 { margin: 0 0 4px; font-size: 15px; }
  .summary-block.bad h3 { color: var(--red-text); }

  /* Toasts */
  .toasts { position: fixed; inset-inline: 0; bottom: 20px; display: grid; justify-items: center; gap: 8px; pointer-events: none; z-index: 100; padding: 0 16px; }
  .toast { background: #111827; color: #fff; padding: 10px 18px; border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.25); font-weight: 600; pointer-events: auto; max-width: 560px; }
  .toast.error { background: var(--red-text); }

  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; background: #eef0f4; color: var(--muted); white-space: nowrap; }
  .chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #9aa3b2; }
  .chip.on { background: #e3f8ee; color: #0b6b47; }
  .chip.on::before { background: #16a34a; }
  .load-error { color: var(--red-text); font-weight: 600; margin-bottom: 8px; }
  .btn[disabled] { opacity: .6; cursor: progress; }

  @media (max-width: 900px) {
    .kpis { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 560px) {
    .page { padding: 16px 12px 32px; }
    .form-grid { grid-template-columns: 1fr; }
    .kpi-value { font-size: 28px; }
    .filters select { min-width: 130px; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="header">
    <div class="title">
      <h1>Customer Retention Dashboard</h1>
      <p data-i18n="subtitle"></p>
    </div>
    <div class="header-actions">
      <span class="chip" id="modeChip"></span>
      <button type="button" class="btn small" id="btnConnect"></button>
      <button type="button" class="btn ghost small" id="btnReset" data-i18n="reset"></button>
      <div class="lang" role="group" aria-label="Language / שפה">
        <button type="button" id="langHe" data-lang="he" lang="he">עברית</button>
        <button type="button" id="langEn" data-lang="en" lang="en">EN</button>
      </div>
    </div>
  </header>

  <section class="kpis" id="kpis" aria-label="KPI"></section>

  <section class="toolbar">
    <div class="toolbar-top">
      <div class="search field">
        <label for="q" class="lbl" data-i18n="searchLabel" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)"></label>
        <input type="search" id="q" data-i18n-placeholder="searchPh" autocomplete="off">
      </div>
      <div class="toolbar-buttons">
        <button type="button" class="btn" id="btnImport" data-i18n="import"></button>
        <button type="button" class="btn" id="btnExport" data-i18n="export"></button>
        <button type="button" class="btn mint" id="btnAdd" data-i18n="add"></button>
      </div>
    </div>
    <div class="filters">
      <div class="field"><label for="fRisk" data-i18n="fRisk"></label><select id="fRisk"></select></div>
      <div class="field"><label for="fActivity" data-i18n="fActivity"></label><select id="fActivity"></select></div>
      <div class="field"><label for="fTickets" data-i18n="fTickets"></label><select id="fTickets"></select></div>
      <div class="field"><label for="fProduct" data-i18n="fProduct"></label><select id="fProduct"></select></div>
      <button type="button" class="btn ghost" id="btnClear" data-i18n="clearFilters"></button>
    </div>
  </section>

  <section class="table-card">
    <div class="table-head">
      <div class="count" id="count" aria-live="polite"></div>
      <button type="button" class="btn small" id="btnRefresh" data-i18n="refresh" hidden></button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr id="thead"></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </section>

  <p class="footer" id="footer"></p>
</div>

<input type="file" id="fileInput" accept=".csv,text/csv" hidden>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<!-- Add / edit dialog -->
<dialog id="dlgCustomer" aria-labelledby="custTitle">
  <form id="custForm" novalidate>
    <div class="dlg-head"><h2 id="custTitle"></h2></div>
    <div class="dlg-body">
      <div class="form-grid">
        <div class="field full" id="idRow" hidden>
          <label for="f_id" data-i18n="col.id"></label>
          <input type="text" id="f_id" class="ltr" readonly>
        </div>
        <div class="field full">
          <label for="f_name" data-i18n="col.name"></label>
          <input type="text" id="f_name" autocomplete="off" aria-describedby="e_name">
          <div class="err" id="e_name"></div>
        </div>
        <div class="field">
          <label for="f_phone" data-i18n="col.phone"></label>
          <input type="text" id="f_phone" class="ltr" inputmode="tel" autocomplete="off" aria-describedby="e_phone">
          <div class="err" id="e_phone"></div>
        </div>
        <div class="field">
          <label for="f_email"><span data-i18n="col.email"></span> <span class="opt" data-i18n="optional"></span></label>
          <input type="email" id="f_email" class="ltr" autocomplete="off" aria-describedby="e_email">
          <div class="err" id="e_email"></div>
        </div>
        <div class="field">
          <label for="f_city"><span data-i18n="col.city"></span> <span class="opt" data-i18n="optional"></span></label>
          <input type="text" id="f_city" autocomplete="off">
        </div>
        <div class="field">
          <label for="f_lastPurchaseDate" data-i18n="col.lastPurchaseDate"></label>
          <input type="date" id="f_lastPurchaseDate" aria-describedby="e_lastPurchaseDate">
          <div class="err" id="e_lastPurchaseDate"></div>
        </div>
        <div class="field">
          <label for="f_totalPurchases"><span data-i18n="col.totalPurchases"></span> (₪)</label>
          <input type="number" id="f_totalPurchases" min="0" step="0.01" inputmode="decimal" aria-describedby="e_totalPurchases">
          <div class="err" id="e_totalPurchases"></div>
        </div>
        <div class="field">
          <label for="f_lastProduct" data-i18n="col.lastProduct"></label>
          <select id="f_lastProduct" aria-describedby="e_lastProduct"></select>
          <div class="err" id="e_lastProduct"></div>
        </div>
        <div class="field">
          <label for="f_satisfaction" data-i18n="col.satisfaction"></label>
          <select id="f_satisfaction" aria-describedby="e_satisfaction"></select>
          <div class="err" id="e_satisfaction"></div>
        </div>
        <div class="field">
          <label for="f_openTickets" data-i18n="col.openTickets"></label>
          <input type="number" id="f_openTickets" min="0" step="1" inputmode="numeric" aria-describedby="e_openTickets">
          <div class="err" id="e_openTickets"></div>
        </div>
      </div>
    </div>
    <div class="dlg-foot">
      <button type="button" class="btn" id="custCancel" data-i18n="cancel"></button>
      <button type="submit" class="btn primary" id="custSubmit" data-i18n="save"></button>
    </div>
  </form>
</dialog>

<!-- Confirm dialog (delete / reset) -->
<dialog id="dlgConfirm" aria-labelledby="confTitle">
  <div class="dlg-head"><h2 id="confTitle"></h2></div>
  <div class="dlg-body" id="confBody"></div>
  <div class="dlg-foot">
    <button type="button" class="btn" id="confCancel" data-i18n="cancel"></button>
    <button type="button" class="btn danger" id="confOk"></button>
  </div>
</dialog>

<!-- Import summary dialog -->
<dialog id="dlgImport" aria-labelledby="impTitle">
  <div class="dlg-head"><h2 id="impTitle"></h2></div>
  <div class="dlg-body" id="impBody"></div>
  <div class="dlg-foot">
    <button type="button" class="btn" id="impCancel"></button>
    <button type="button" class="btn primary" id="impOk" data-i18n="impConfirm"></button>
  </div>
</dialog>

<!-- Airtable connection dialog -->
<dialog id="dlgAirtable" aria-labelledby="atTitle">
  <form id="atForm" novalidate>
    <div class="dlg-head"><h2 id="atTitle" data-i18n="atTitle"></h2></div>
    <div class="dlg-body">
      <p class="hint" data-i18n="atHelp"></p>
      <div class="form-grid">
        <div class="field full">
          <label for="at_base" data-i18n="atBase"></label>
          <input type="text" id="at_base" class="ltr" autocomplete="off" spellcheck="false" placeholder="appXXXXXXXXXXXXXX">
        </div>
        <div class="field full">
          <label for="at_table" data-i18n="atTable"></label>
          <input type="text" id="at_table" class="ltr" autocomplete="off" spellcheck="false">
        </div>
        <div class="field full">
          <label for="at_token" data-i18n="atToken"></label>
          <input type="password" id="at_token" class="ltr" autocomplete="off" spellcheck="false">
          <div class="hint" id="at_tokenHint"></div>
        </div>
      </div>
      <div class="err" id="at_err" role="alert"></div>
    </div>
    <div class="dlg-foot">
      <button type="button" class="btn" id="atCancel" data-i18n="cancel"></button>
      <button type="button" class="btn danger" id="atDisconnect" data-i18n="atDisconnect" hidden></button>
      <button type="submit" class="btn primary" id="atSubmit" data-i18n="atConnect"></button>
    </div>
  </form>
</dialog>

  function toCSV(list) {
    var lines = [FIELDS.join(',')];
    list.forEach(function (c) {
      lines.push(FIELDS.map(function (f) { return csvEscape(c[f], TEXT_FIELDS.indexOf(f) !== -1); }).join(','));
    });
    return lines.join('\r\n') + '\r\n';
  }
  function unguard(v) { return /^'[=+\-@\t\r]/.test(v) ? v.slice(1) : v; }

  /* ---------- Storage ---------- */
  function mockCustomers() {
    var rows = parseCSV($('mock-csv').textContent.replace(/^\s+/, ''));
    var head = rows.shift().map(function (h) { return h.trim(); });
    var out = [];
    rows.forEach(function (r) {
      if (r.every(function (x) { return x === ''; })) return;
      var raw = {};
      head.forEach(function (h, i) { raw[h] = r[i]; });
      var res = validateCustomer(raw, { checkId: true });
      if (!Object.keys(res.errors).length) out.push(res.value);
    });
    return out;
  }
  function loadCustomers() {
    try {

    return mockCustomers();
  }
  function persist() {
    if (at) return;    // data lives in Airtable; keep it out of browser storage

    catch (e) { storageOk = false; renderFooter(); }
  }
  function nextId(extraIds) {
    var max = 0;
    customers.forEach(function (c) { var m = /^C-(\d+)$/.exec(c.id); if (m) max = Math.max(max, +m[1]); });
    (extraIds || []).forEach(function (id) { var m = /^C-(\d+)$/.exec(id); if (m) max = Math.max(max, +m[1]); });
    return 'C-' + String(max + 1).padStart(4, '0');
  }

  /* ---------- Rendering ---------- */

  function setOptions(sel, items) {

  function buildSelects() {

    setOptions($('fTickets'), [all, { value: 'with', label: t('tixYes') }, { value: 'without', label: t('tixNo') }]);

    setOptions($('f_satisfaction'), [{ value: '', label: t('select') }].concat([1, 2, 3, 4, 5].map(function (n) { return { value: String(n), label: t('sat' + n) }; })));
    $('fRisk').value = filters.risk; $('fActivity').value = filters.activity;

  function renderKPIs() {
    var total = customers.length;
    var active = customers.filter(isActive).length;
    var risk = customers.filter(isAtRisk).length;
    var rated = customers.filter(function (c) { return c.satisfaction != null; });
    var avg = rated.length ? rated.reduce(function (s, c) { return s + c.satisfaction; }, 0) / rated.length : null;
    var tix = customers.reduce(function (s, c) { return s + c.openTickets; }, 0);
    var avgTxt = avg == null ? '—' : new Intl.NumberFormat(locale(), { minimumFractionDigits: 1, maximumFractionDigits: 1 }).format(avg);
    var cards = [
      { label: t('kpi.total'), value: fmtInt(total), sub: risk ? t('subTotalRisk', { n: fmtInt(risk) }) : t('subTotalNone'), subClass: risk ? ' risk' : '' },
      { label: t('kpi.active'), value: fmtInt(active), sub: t('subActive') },
      { label: t('kpi.avg'), value: avgTxt, sub: t('subAvg') },
      { label: t('kpi.tickets'), value: fmtInt(tix), sub: t('subTickets'), cls: tix > 0 ? ' warn' : '' }
    ];
    $('kpis').innerHTML = cards.map(function (c) {
      return '<div class="kpi' + (c.cls || '') + '"><div class="kpi-label">' + esc(c.label) + '</div><div class="kpi-value">' + esc(c.value) +
        '</div><div class="kpi-sub' + (c.subClass || '') + '">' + esc(c.sub) + '</div></div>';
    }).join('');
  }

  function matches(c) {
    var q = filters.q.trim().toLowerCase();
    if (q) {
      var hay = [c.name, c.id, c.phone, c.email, c.city].join('\n').toLowerCase();
      var qd = q.replace(/\D/g, '');
      if (hay.indexOf(q) === -1 && !(qd && c.phone.replace(/\D/g, '').indexOf(qd) !== -1)) return false;
    }
    if (filters.risk === 'risk' && !isAtRisk(c)) return false;
    if (filters.risk === 'ok' && isAtRisk(c)) return false;
    if (filters.activity === 'active' && !isActive(c)) return false;
    if (filters.activity === 'inactive' && isActive(c)) return false;
    if (filters.tickets === 'with' && c.openTickets <= 0) return false;
    if (filters.tickets === 'without' && c.openTickets > 0) return false;
    if (filters.product !== 'all' && c.lastProduct !== filters.product) return false;
    return true;
  }
  function compare(a, b, key) {
    if (key === 'satisfaction' || key === 'openTickets' || key === 'totalPurchases') return (a[key] == null ? 99 : a[key]) - (b[key] == null ? 99 : b[key]);
    if (key === 'lastPurchaseDate') return a[key] < b[key] ? -1 : a[key] > b[key] ? 1 : 0;
    if (key === 'lastProduct') return productLabel(a[key]).localeCompare(productLabel(b[key]), locale());
    return String(a[key]).localeCompare(String(b[key]), locale(), { numeric: true, sensitivity: 'base' });
  }
  function visibleRows() {
    var rows = customers.filter(matches);
    if (!sort.dir) return rows;
    var m = sort.dir === 'asc' ? 1 : -1;
    return rows.map(function (c, i) { return [c, i]; }).sort(function (x, y) {
      var r = compare(x[0], y[0], sort.key);
      return r === 0 ? x[1] - y[1] : r * m;
    }).map(function (p) { return p[0]; });
  }

  function renderHead() {

        ' <span class="arrow" aria-hidden="true">' + arrow + '</span></button></th>';

  }

  function renderTable() {

    if (loading || loadError) {
      $('tbody').innerHTML = '<tr><td colspan="' + (FIELDS.length + 1) + '" class="empty">' +
        (loading ? '<strong>' + esc(t('loading')) + '</strong>'

      $('tbody').innerHTML = '<tr><td colspan="' + (FIELDS.length + 1) + '" class="empty"><strong>' + esc(none ? t('emptyAll') : t('emptyFilter')) + '</strong>' +
        esc(none ? t('emptyAllHint') : t('emptyFilterHint')) +
        (none ? '' : '<br><button type="button" class="btn" data-action="clear">' + esc(t('clearFilters')) + '</button>') + '</td></tr>';
      return;
    }
    $('tbody').innerHTML = rows.map(function (c) {
      var risk = isAtRisk(c), active = isActive(c);
      var dots = '';
      for (var i = 1; i <= 5; i++) dots += '<i class="' + (c.satisfaction != null && i <= c.satisfaction ? 'on' : '') + '"></i>';
      return '<tr class="' + (risk ? 'risk' : '') + '" data-id="' + esc(c.id) + '">' +
        '<td class="mono">' + esc(c.id) + '</td>' +
        '<td class="name">' + esc(c.name) + '</td>' +
        '<td class="nowrap"><bdi dir="ltr">' + esc(c.phone) + '</bdi></td>' +
        '<td><bdi dir="ltr">' + esc(c.email) + '</bdi></td>' +
        '<td class="nowrap">' + esc(c.city) + '</td>' +
        '<td class="nowrap">' + esc(fmtDate(c.lastPurchaseDate)) + (active ? '' : '<span class="tag">' + esc(t('inactive')) + '</span>') + '</td>' +
        '<td class="num nowrap">' + esc(fmtMoney(c.totalPurchases)) + '</td>' +
        '<td class="nowrap">' + esc(productLabel(c.lastProduct)) + '</td>' +

          (risk ? '<span class="badge">' + esc(t('atRisk')) + '</span>' : '') + '</td>' +
        '<td class="num' + (c.openTickets > 0 ? ' tix-pos' : '') + '">' + esc(fmtInt(c.openTickets)) + '</td>' +
        '<td><div class="actions">' +
          '<button type="button" class="btn small" data-action="edit" aria-label="' + esc(t('editAria', { name: c.name })) + '">' + esc(t('edit')) + '</button>' +
          '<button type="button" class="btn small" data-action="delete" aria-label="' + esc(t('delAria', { name: c.name })) + '">' + esc(t('del')) + '</button>' +
        '</div></td></tr>';
    }).join('');
  }
  function renderFooter() {
    $('footer').innerHTML = esc(at ? t('footerAt') : t('footer')) + (storageOk || at ? '' : '<span class="warn-text">' + esc(t('storageOff')) + '</span>');
  }
  function renderMode() {
    var chip = $('modeChip');
    chip.textContent = at ? t('modeAt') : t('modeLocal');
    chip.classList.toggle('on', !!at);
    $('btnConnect').textContent = at ? t('settingsBtn') : t('connectBtn');
    $('btnRefresh').hidden = !at;
    $('btnReset').hidden = !!at;
  }
  function renderAll() { renderMode(); renderKPIs(); renderHead(); renderTable(); renderFooter(); }

  /* ---------- Toasts ---------- */
  function toast(msg, isError) {
    var el = document.createElement('div');
    el.className = 'toast' + (isError ? ' error' : '');
    el.textContent = msg;
    $('toasts').appendChild(el);
    setTimeout(function () { el.remove(); }, 4000);
  }

  /* ---------- Airtable ---------- */
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function errMsg(err) {
    if (err && err.network) return t('atErrNetwork');
    if (err && (err.status === 401 || err.status === 403)) return t('atErrAuth');
    if (err && err.status === 404) return t('atErrNotFound');
    return (err && err.message) || t('atErrGeneric');
  }
  function atRequest(cfg, method, path, body) {
    var url = 'https://api.airtable.com/v0/' + cfg.baseId + '/' + encodeURIComponent(cfg.table) + (path || '');
    return fetch(url, {
      method: method,
      headers: { 'Authorization': 'Bearer ' + cfg.token, 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) {
          var m = j && j.error && (typeof j.error === 'string' ? j.error : (j.error.message || j.error.type));
          var e = new Error(m || ('HTTP ' + r.status)); e.status = r.status; throw e;
        }
        return j;
      });
    }, function () { var e = new Error('network'); e.network = true; throw e; });
  }
  function fromRecord(rec) {
    var f = rec.fields || {};
    function str(v) { return v == null ? '' : String(v).trim(); }
    var sat = f.satisfaction, tix = parseInt(f.openTickets, 10), tp = Number(f.totalPurchases);
    return {
      id: str(f.id), name: str(f.name), phone: str(f.phone), email: str(f.email), city: str(f.city),
      lastPurchaseDate: parseISO(f.lastPurchaseDate) != null ? String(f.lastPurchaseDate) : '',
      totalPurchases: isFinite(tp) ? tp : 0,
      lastProduct: normalizeProduct(f.lastProduct) || '',
      satisfaction: (Number.isInteger(sat) && sat >= 1 && sat <= 5) ? sat : null,
      openTickets: tix > 0 ? tix : 0,
      _rid: rec.id
    };
  }
  function toFields(c) {
    return {
      name: c.name, id: c.id, phone: c.phone, email: c.email || null, city: c.city || null,
      lastPurchaseDate: c.lastPurchaseDate || null, totalPurchases: c.totalPurchases,
      lastProduct: c.lastProduct || null, satisfaction: c.satisfaction, openTickets: c.openTickets
    };
  }
  function atLoadAll(cfg) {
    var out = [];
    function page(offset) {
      return atRequest(cfg, 'GET', '?pageSize=100' + (offset ? '&offset=' + encodeURIComponent(offset) : '')).then(function (j) {
        (j.records || []).forEach(function (r) { out.push(fromRecord(r)); });
        return j.offset ? page(j.offset) : out;
      });
    }
    return page(null);
  }
  function batches(list) {
    var out = [];
    for (var i = 0; i < list.length; i += AT_BATCH) out.push(list.slice(i, i + AT_BATCH));
    return out;
  }
  function runBatches(list, fn) {          // sequential, with a pause to stay under Airtable's 5 requests/second limit
    var results = [];
    return batches(list).reduce(function (p, b, i) {
      return p.then(function () { return (i ? sleep(250) : null); }).then(function () { return fn(b); }).then(function (r) { results = results.concat(r); });
    }, Promise.resolve()).then(function () { return results; });
  }
  function atCreate(list) {
    return runBatches(list, function (b) {
      return atRequest(at, 'POST', '', { records: b.map(function (c) { return { fields: toFields(c) }; }) }).then(function (j) { return j.records; });
    });
  }
  function atPatch(records) {              // records: [{ id: recordId, fields: {...} }]
    return runBatches(records, function (b) { return atRequest(at, 'PATCH', '', { records: b }).then(function (j) { return j.records; }); });
  }
  function atUpdate(list) {
    return atPatch(list.map(function (c) { return { id: c._rid, fields: toFields(c) }; }));
  }
  function atDelete(rid) { return atRequest(at, 'DELETE', '/' + encodeURIComponent(rid)); }

  function withBusy(btn, promise) {
    btn.disabled = true; btn.setAttribute('aria-busy', 'true');
    function done() { btn.disabled = false; btn.removeAttribute('aria-busy'); }
    promise.then(done, done);
    return promise;
  }
  // Records created by hand in Airtable have no customer ID yet: give them one so they can be edited and merged.
  function fixMissingIds() {
    var missing = customers.filter(function (c) { return !c.id; });
    if (!missing.length) return Promise.resolve();
    missing.forEach(function (c) { c.id = nextId(); });
    return atPatch(missing.map(function (c) { return { id: c._rid, fields: { id: c.id } }; })).then(function () {
      toast(t('tIdsFixed', { n: fmtInt(missing.length) }));
    }, function (err) { toast(t('tSaveFail', { msg: errMsg(err) }), true); });
  }
  function atReload(announce) {
    loading = true; loadError = ''; renderAll();
    return atLoadAll(at).then(function (list) {
      customers = list; loading = false; renderAll();
      if (announce) toast(t('tRefreshed'));
      return fixMissingIds().then(renderAll);
    }, function (err) {
      loading = false; loadError = errMsg(err); renderAll();
    });
  }
  function readAt() {
    try {
      var c = JSON.parse(localStorage.getItem(AT_KEY));
      if (c && c.token && c.baseId && c.table) return c;
    } catch (e) { /* ignore */ }
    return null;
  }

  /* Connection dialog */
  function openAirtableDialog() {
    $('at_err').textContent = '';
    $('at_base').value = at ? at.baseId : '';
    $('at_table').value = at ? at.table : 'Customers';
    $('at_token').value = '';
    $('at_tokenHint').textContent = at ? t('atTokenSaved') : '';
    $('atDisconnect').hidden = !at;
    $('dlgAirtable').showModal();
    $(at ? 'at_token' : 'at_base').focus();
  }
  function submitAirtable(e) {
    e.preventDefault();
    var base = $('at_base').value.trim(), table = $('at_table').value.trim(), token = $('at_token').value.trim() || (at ? at.token : '');
    var err = !/^app[A-Za-z0-9]{14}$/.test(base) ? 'atErrBase' : !table ? 'atErrTable' : !token ? 'atErrToken' : '';
    if (err) { $('at_err').textContent = t(err); return; }
    var cfg = { token: token, baseId: base, table: table };
    $('at_err').textContent = '';
    var btn = $('atSubmit'), label = btn.textContent;
    btn.textContent = t('atConnecting');
    withBusy(btn, atLoadAll(cfg)).then(function (list) {
      btn.textContent = label;
      try { localStorage.setItem(AT_KEY, JSON.stringify(cfg)); } catch (x) { /* connection still works for this session */ }
      at = cfg; customers = list; loading = false; loadError = '';
      $('dlgAirtable').close();
      renderAll();
      toast(t('tConnected', { n: fmtInt(list.length) }));
      fixMissingIds().then(renderAll);
    }, function (error) {
      btn.textContent = label;
      $('at_err').textContent = errMsg(error);
    });
  }
  function disconnectAirtable() {
    try { localStorage.removeItem(AT_KEY); } catch (e) { /* ignore */ }
    at = null; loading = false; loadError = '';

    toast(t('tDisconnected'));
  }

  /* ---------- Dialogs ---------- */
  function backdropClose(dlg) {
    dlg.addEventListener('mousedown', function (e) { if (e.target === dlg) dlg.close(); });
  }
  function confirmDialog(opts) {
    return new Promise(function (resolve) {
      var dlg = $('dlgConfirm');
      $('confTitle').textContent = opts.title;
      $('confBody').textContent = opts.body;
      $('confOk').textContent = opts.okLabel;
      var done = false;
      function finish(v) { if (done) return; done = true; cleanup(); if (dlg.open) dlg.close(); resolve(v); }
      function ok() { finish(true); }
      function cancel() { finish(false); }
      function cleanup() {
        $('confOk').removeEventListener('click', ok);
        $('confCancel').removeEventListener('click', cancel);
        dlg.removeEventListener('close', cancel);
      }
      $('confOk').addEventListener('click', ok);
      $('confCancel').addEventListener('click', cancel);
      dlg.addEventListener('close', cancel);
      dlg.showModal();
      $('confCancel').focus();
    });
  }

  /* Add / edit */
  var FORM_FIELDS = ['name', 'phone', 'email', 'city', 'lastPurchaseDate', 'totalPurchases', 'lastProduct', 'satisfaction', 'openTickets'];
  function clearErrors() {
    FORM_FIELDS.forEach(function (f) {
      var e = $('e_' + f); if (e) e.textContent = '';
      $('f_' + f).removeAttribute('aria-invalid');
    });
  }
  function openCustomer(c) {
    editingId = c ? c.id : null;
    clearErrors();
    $('custTitle').textContent = t(c ? 'editTitle' : 'addTitle');
    $('idRow').hidden = !c;
    $('f_id').value = c ? c.id : '';
    FORM_FIELDS.forEach(function (f) {
      var v = c ? c[f] : (f === 'openTickets' ? 0 : '');
      $('f_' + f).value = v == null ? '' : String(v);
    });
    $('f_lastPurchaseDate').max = todayISO();
    $('dlgCustomer').showModal();
    $('f_name').focus();
  }
  function submitCustomer(e) {
    e.preventDefault();
    clearErrors();
    var raw = {};
    FORM_FIELDS.forEach(function (f) { raw[f] = $('f_' + f).value; });
    var res = validateCustomer(raw);
    var keys = Object.keys(res.errors);
    if (keys.length) {
      var first = null;
      FORM_FIELDS.forEach(function (f) {
        if (res.errors[f]) {
          $('e_' + f).textContent = t(res.errors[f]);
          $('f_' + f).setAttribute('aria-invalid', 'true');
          if (!first) first = $('f_' + f);
        }
      });
      if (first) first.focus();
      return;
    }
    var v = res.value;
    var existing = editingId ? customers.find(function (c) { return c.id === editingId; }) : null;
    v.id = editingId || nextId();
    function commit() {
      if (editingId) {
        var idx = customers.indexOf(existing);
        if (idx !== -1) customers[idx] = v;
        toast(t('tUpdated'));
      } else {
        customers.push(v);
        toast(t('tAdded'));
      }
      persist();
      $('dlgCustomer').close();
      renderAll();
    }
    if (!at) { commit(); return; }
    var job = existing
      ? (v._rid = existing._rid, atUpdate([v]))
      : atCreate([v]).then(function (recs) { v._rid = recs[0].id; });
    withBusy($('custSubmit'), job).then(commit, function (err) { toast(t('tSaveFail', { msg: errMsg(err) }), true); });
  }

  /* Delete */
  function deleteCustomer(id) {
    var c = customers.find(function (x) { return x.id === id; });
    if (!c) return;
    confirmDialog({ title: t('delTitle'), body: t('delBody', { name: c.name }), okLabel: t('delOk') }).then(function (yes) {
      if (!yes) return;
      function done() { customers = customers.filter(function (x) { return x !== c; }); persist(); renderAll(); toast(t('tDeleted')); }
      if (!at) { done(); return; }
      atDelete(c._rid).then(done, function (err) { toast(t('tSaveFail', { msg: errMsg(err) }), true); });
    });
  }

  /* Reset */
  function resetData() {
    confirmDialog({ title: t('resetTitle'), body: t('resetBody'), okLabel: t('resetOk') }).then(function (yes) {
      if (!yes) return;
      customers = mockCustomers();
      persist(); renderAll(); toast(t('tReset'));
    });
  }

  /* ---------- Import / export ---------- */
  function exportCSV() {
    var csv = '﻿' + toCSV(customers);
    var blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'customers-' + todayISO() + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    toast(t('tExported', { n: fmtInt(customers.length) }));
  }

  function showImportDialog(title, bodyHtml, canConfirm) {
    $('impTitle').textContent = title;
    $('impBody').innerHTML = bodyHtml;
    $('impOk').hidden = !canConfirm;
    $('impCancel').textContent = canConfirm ? t('cancel') : t('close');
    var dlg = $('dlgImport');
    if (!dlg.open) dlg.showModal();
  }

  function analyzeImport(text) {
    var rows = parseCSV(text);
    while (rows.length && rows[rows.length - 1].every(function (x) { return x.trim() === ''; })) rows.pop();
    if (!rows.length) return { fatal: t('emptyFile') };
    var headers = rows[0].map(function (h) { return h.replace(/^﻿/, '').trim().toLowerCase(); });
    var colOf = {}, missing = [];
    FIELDS.forEach(function (f) {
      var i = headers.indexOf(f.toLowerCase());
      if (i === -1) missing.push(f); else colOf[f] = i;
    });
    if (missing.length) return { fatal: t('missingHeaders', { list: missing.join(', ') }) };

    var existing = {};
    customers.forEach(function (c) { existing[c.id] = true; });
    var seen = {}, adds = [], updates = [], rejected = [];
    for (var r = 1; r < rows.length; r++) {
      var rec = rows[r];
      if (rec.every(function (x) { return x.trim() === ''; })) continue;
      var rowNo = r + 1;                                    // header is row 1, as in a spreadsheet
      var raw = {};
      FIELDS.forEach(function (f) { raw[f] = unguard(String(rec[colOf[f]] == null ? '' : rec[colOf[f]])); });
      var res = validateCustomer(raw, { checkId: true });
      var reasons = Object.keys(res.errors).map(function (f) { return t('col.' + f) + ': ' + t(res.errors[f]); });
      var id = res.value.id;
      if (!reasons.length && id) {
        if (seen[id]) reasons.push(t('dupInFile', { row: seen[id] }));
        else seen[id] = rowNo;
      }
      if (reasons.length) { rejected.push({ row: rowNo, reasons: reasons }); continue; }
      if (id && existing[id]) updates.push(res.value); else adds.push(res.value);
    }
    return { adds: adds, updates: updates, rejected: rejected };
  }

  function list(items) { return '<ul class="summary-list">' + items.map(function (i) { return '<li>' + i + '</li>'; }).join('') + '</ul>'; }

  function handleImportFile(file) {
    var reader = new FileReader();
    reader.onerror = function () { toast(t('readErr'), true); };
    reader.onload = function () {
      var res = analyzeImport(String(reader.result));
      pendingImport = null;
      if (res.fatal) { showImportDialog(t('impFailTitle'), '<p>' + esc(res.fatal) + '</p>', false); return; }
      var html = '<div class="summary-block"><h3>' + esc(t('impNew', { n: fmtInt(res.adds.length) })) + '</h3></div>' +
        '<div class="summary-block"><h3>' + esc(t('impUpd', { n: fmtInt(res.updates.length) })) + '</h3>' +
        (res.updates.length ? '<div class="hint">' + esc(t('impUpdList')) + '</div>' + list(res.updates.map(function (c) { return '<bdi dir="ltr">' + esc(c.id) + '</bdi> — ' + esc(c.name); })) : '') + '</div>' +
        '<div class="summary-block' + (res.rejected.length ? ' bad' : '') + '"><h3>' + esc(t('impRej', { n: fmtInt(res.rejected.length) })) + '</h3>' +
        (res.rejected.length ? '<div class="hint">' + esc(t('impRejList')) + '</div>' + list(res.rejected.map(function (x) { return '<strong>' + esc(t('row', { n: x.row })) + '</strong>: ' + esc(x.reasons.join('; ')); })) : '') + '</div>';
      var can = res.adds.length + res.updates.length > 0;
      if (!can) html += '<p>' + esc(t('impNothing')) + '</p>';
      pendingImport = can ? res : null;
      showImportDialog(t('impTitle'), html, can);
    };
    reader.readAsText(file, 'UTF-8');
  }

  function applyImport() {
    var res = pendingImport;
    if (!res) return;
    var existingById = {};
    customers.forEach(function (c) { existingById[c.id] = c; });
    res.updates.forEach(function (c) { if (existingById[c.id]) c._rid = existingById[c.id]._rid; });
    var taken = res.adds.map(function (c) { return c.id; }).filter(Boolean);
    res.adds.forEach(function (c) { if (!c.id) { c.id = nextId(taken); taken.push(c.id); } });
    function commit() {
      var byId = {};
      res.updates.forEach(function (c) { byId[c.id] = c; });
      customers = customers.map(function (c) { return byId[c.id] ? byId[c.id] : c; });
      res.adds.forEach(function (c) { customers.push(c); });
      persist();
      $('dlgImport').close();
      renderAll();
      toast(t('tImported', { a: fmtInt(res.adds.length), u: fmtInt(res.updates.length), r: fmtInt(res.rejected.length) }));
      pendingImport = null;
    }
    if (!at) { commit(); return; }
    var job = atUpdate(res.updates).then(function () { return atCreate(res.adds); }).then(function (recs) {
      res.adds.forEach(function (c, i) { c._rid = recs[i].id; });
    });
    withBusy($('impOk'), job).then(commit, function (err) {
      toast(t('tSaveFail', { msg: errMsg(err) }), true);
      pendingImport = null; $('dlgImport').close();
      atReload(false);               // some batches may have been written: resync with Airtable
    });
  }

  /* ---------- Events ---------- */
  function setLang(l) {
    lang = l;
    try { localStorage.setItem(LANG_KEY, l); } catch (e) { /* ignore */ }
    applyLang();
  }
  function clearFilters() {
    filters = { q: '', risk: 'all', activity: 'all', tickets: 'all', product: 'all' };
    $('q').value = '';
    $('fRisk').value = 'all'; $('fActivity').value = 'all'; $('fTickets').value = 'all'; $('fProduct').value = 'all';
    renderTable();
  }

  function init() {
    try { var l = localStorage.getItem(LANG_KEY); if (l === 'he' || l === 'en') lang = l; } catch (e) { storageOk = false; }
    try { localStorage.setItem('crd.probe', '1'); localStorage.removeItem('crd.probe'); } catch (e) { storageOk = false; }
    at = readAt();
    customers = at ? [] : loadCustomers();
    if (!at && storageOk) persist();

    $('langHe').addEventListener('click', function () { setLang('he'); });
    $('langEn').addEventListener('click', function () { setLang('en'); });
    $('btnReset').addEventListener('click', resetData);
    $('btnConnect').addEventListener('click', openAirtableDialog);
    $('btnRefresh').addEventListener('click', function () { withBusy($('btnRefresh'), atReload(true)); });
    $('atForm').addEventListener('submit', submitAirtable);
    $('atCancel').addEventListener('click', function () { $('dlgAirtable').close(); });
    $('atDisconnect').addEventListener('click', disconnectAirtable);
    $('btnAdd').addEventListener('click', function () { openCustomer(null); });
    $('btnExport').addEventListener('click', exportCSV);
    $('btnImport').addEventListener('click', function () { $('fileInput').click(); });
    $('btnClear').addEventListener('click', clearFilters);
    $('fileInput').addEventListener('change', function (e) {
      var f = e.target.files && e.target.files[0];
      if (f) handleImportFile(f);
      e.target.value = '';
    });

    $('q').addEventListener('input', function (e) { filters.q = e.target.value; renderTable(); });
    [['fRisk', 'risk'], ['fActivity', 'activity'], ['fTickets', 'tickets'], ['fProduct', 'product']].forEach(function (p) {
      $(p[0]).addEventListener('change', function (e) { filters[p[1]] = e.target.value; renderTable(); });
    });

    $('thead').addEventListener('click', function (e) {
      var b = e.target.closest('[data-sort]');
      if (!b) return;
      var k = b.getAttribute('data-sort');
      if (sort.key !== k || !sort.dir) sort = { key: k, dir: 'asc' };
      else if (sort.dir === 'asc') sort.dir = 'desc';
      else sort = { key: k, dir: null };
      renderHead(); renderTable();
      var again = document.querySelector('[data-sort="' + k + '"]'); if (again) again.focus();
    });
    $('tbody').addEventListener('click', function (e) {
      var b = e.target.closest('[data-action]');
      if (!b) return;
      var action = b.getAttribute('data-action');
      if (action === 'clear') { clearFilters(); return; }
      if (action === 'retry') { atReload(false); return; }
      var tr = b.closest('tr'); var id = tr && tr.getAttribute('data-id');
      var c = customers.find(function (x) { return x.id === id; });
      if (!c) return;
      if (action === 'edit') openCustomer(c);
      if (action === 'delete') deleteCustomer(id);
    });

    $('custForm').addEventListener('submit', submitCustomer);
    $('custCancel').addEventListener('click', function () { $('dlgCustomer').close(); });
    $('impCancel').addEventListener('click', function () { pendingImport = null; $('dlgImport').close(); });
    $('impOk').addEventListener('click', applyImport);
    $('dlgImport').addEventListener('close', function () { pendingImport = null; });
    ['dlgCustomer', 'dlgConfirm', 'dlgImport', 'dlgAirtable'].forEach(function (id) { backdropClose($(id)); });

    applyLang();
    if (at) atReload(false);
  }

  init();
})();
</script>
</body>
</html>
